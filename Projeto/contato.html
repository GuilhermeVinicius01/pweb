<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>JM Viagens - Contato e Busca de Pacotes</title>
    <meta charset="utf-8" />
</head>
<body>

    <table border="0" width="900" align="center">
        <tr>
            <td><img src="imagens/logo.png" alt="JM Viagens" /></td>
            <td align="right">
                <a href="index.html">Home</a> | 
                <a href="quem-somos.html">Quem somos</a> | 
                <a href="contato.html">Contato e Buscas</a>
            </td>
        </tr>
        <tr>
            <td colspan="2">
                <img src="imagens/contato.png" width="900" alt="Contato" />
            </td>
        </tr>
        <tr>
            <td colspan="2">
                <h3>E-mail: jmviagens@jmviagens.com.br</h3>
                
                <h3>Formulário de Contato</h3>
                <form action="#" method="post">
                    <table border="0" width="500" cellpadding="5">
                        <tr>
                            <td><label for="nome">Nome:</label></td>
                            <td><input type="text" id="nome" name="nome" required style="width: 100%;" /></td>
                        </tr>
                        <tr>
                            <td><label for="email">E-mail:</label></td>
                            <td><input type="email" id="email" name="email" required style="width: 100%;" /></td>
                        </tr>
                        <tr>
                            <td><label for="mensagem">Mensagem:</label></td>
                            <td><textarea id="mensagem" name="mensagem" rows="4" required style="width: 100%;"></textarea></td>
                        </tr>
                        <tr>
                            <td></td>
                            <td><input type="submit" value="Enviar Mensagem" /></td>
                        </tr>
                    </table>
                </form>
                
                <br /><hr /><br />

                <h3>Buscar Pacotes de Viagens</h3>
                <form action="#" method="get">
                    <table border="0" width="500" cellpadding="5">
                        <tr>
                            <td><label for="origem">Origem:</label></td>
                            <td><input type="text" id="origem" name="origem" required /></td>
                        </tr>
                        <tr>
                            <td><label for="destino">Destino:</label></td>
                            <td><input type="text" id="destino" name="destino" required /></td>
                        </tr>
                        <tr>
                            <td><label for="partida">Data Partida:</label></td>
                            <td><input type="date" id="partida" name="partida" required /></td>
                        </tr>
                        <tr>
                            <td><label for="retorno">Data Retorno:</label></td>
                            <td><input type="date" id="retorno" name="retorno" required /></td>
                        </tr>
                        <tr>
                            <td><label for="quartos">Quartos:</label></td>
                            <td><input type="number" id="quartos" name="quartos" min="1" value="1" required /></td>
                        </tr>
                        <tr>
                            <td><label for="adultos">Qtde Adultos:</label></td>
                            <td><input type="number" id="adultos" name="adultos" min="1" value="1" required /></td>
                        </tr>
                        <tr>
                            <td><label for="criancas">Qtde Crianças:</label></td>
                            <td><input type="number" id="criancas" name="criancas" min="0" value="0" required /></td>
                        </tr>
                        <tr>
                            <td></td>
                            <td><input type="submit" value="Buscar Pacotes" /></td>
                        </tr>
                    </table>
                </form>
                <br />
            </td>
        </tr>
        <tr>
            <td colspan="2" align="center">
                <h4>Todos os direitos reservados</h4>
            </td>
        </tr>
    </table>

</body>
</html>
